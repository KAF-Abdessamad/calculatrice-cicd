
name: Pipeline CI/CD Calculatrice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (style du code)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Flake8
        run: pip install flake8

      - name: Vérifier le style du code
        run: flake8 . --max-line-length=100

  test:
    name: Tests automatiques
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter les tests
        run: python -m pytest -v

  build:
    name: Construction du paquet
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Créer le paquet
        run: mkdir dist && cp calculatrice.py dist/

      - name: Archiver le paquet
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-paquet
          path: dist/

  deploy:
    name: Déploiement simulé
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Télécharger le paquet
        uses: actions/download-artifact@v4
        with:
          name: calculatrice-paquet
          path: dist/

      - name: Vérifier le paquet
        run: ls -l dist/

      - name: Confirmer le déploiement
        run: echo "Application déployée avec succès !"
